<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<title>深層礦脈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="css/style.css?v=1.04.01">
</head>
<body>
<div id="app">

  <!-- ===== 頂部：玩家名稱 / 資金 / 可挖次數 ===== -->
  <header id="hud" data-edit="hud" data-label="頂部資訊列">
    <div class="hud-top"><div class="hud-name" id="hudName">玩家</div>
      <button id="mailBtn" class="hud-mail" title="信箱">✉<span id="mailDot" class="hud-dot hidden">0</span></button></div>
    <div class="hud-bottom"><div class="hud-title" id="hudTitle"></div>
      <div class="hud-stats"><div class="hud-stat"><span class="hud-ico">$</span><span id="hudCoins">0</span></div>
        <button id="hudRuby" class="hud-stat hud-ruby hidden" title="紅晶"><svg class="ruby-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-ruby"/></svg><span id="hudRubyN">0</span></button>
        <div class="hud-stat"><span class="hud-ico">⛏</span><span id="hudPlays">0</span></div></div></div>
  </header>

  <main id="screens">

    <!-- ===== 挖礦 ===== -->
    <section class="screen active" id="scr-mine">
      <!-- v0.10.13：礦坑名稱／階段／統計整合進場景上方的固定資訊區 -->
      <div id="scene" class="px-box" data-edit="scene" data-label="場景區">
        <div id="mineBar" class="scene-info" data-edit="mineBar" data-label="礦坑資訊列">
          <div class="mb-row">
            <span id="mbName" class="mb-name">淺層洞窟</span>
            <span id="mbState" class="mb-state"></span>
          </div>
          <div class="mb-row mb-data" id="mbData">
            <span>今日此坑挖掘 <b id="mbSwings">0</b></span>
            <span>礦脈 <b id="mbHits">0</b></span>
            <span><span id="mbSinceL">距離上次遇見礦脈挖掘</span> <b id="mbSince">0</b></span>
          </div>
          <div class="mb-row mb-data hidden" id="huntData">
            <span>可走 <b id="hbStep">0</b> 步</span>
            <span>本輪金幣 <b id="hbGold">0</b></span>
            <span>去過國度 <b id="hbVisit">0</b> 次</span>
            <div class="hb-btns"><button class="px-btn small hb-abi" data-hunt="panel">本趟能力<i class="hb-dot hidden" id="huntDot"></i></button>
            <button class="px-btn small hb-bag" data-hunt="bag">行囊<img id="huntBagIc" class="hb-ic" alt=""></button></div>
          </div>
        </div>
        <div id="veinBanner" class="vein-banner hidden" data-edit="veinBanner" data-label="礦脈看板">
          <div id="vbUp" class="vb-up hidden">已獲得最終認可</div>
          <div><b id="vbChain">BB</b></div>
          <div>剩餘 <b id="vbLeft">25</b></div>
          <div>收穫 <b id="vbGain">0</b></div>
        </div>
        <div id="sceneStage" class="scene-stage">
          <div id="sceneBig" class="scene-big">⛏</div>
          <div id="sceneSub" class="scene-sub">點擊下方敘述框開始挖礦</div>
          <div id="verTag" class="ver-tag"></div>
          <div id="clockTag" class="clock-tag hidden"></div>
          <div id="probeTag" class="probe-tag hidden"></div>
        </div>
      </div>

      <div id="textbox" class="px-box textbox" data-edit="textbox" data-label="敘述框（點擊挖礦）">
        <div id="tbTag" class="tb-tag hidden"></div>
        <div id="tbLines"></div>
        <div id="tbChoice" class="tb-choice hidden"></div>
        <div id="tbTap" class="tb-tap">▼ 點擊</div>
        <i class="fr-gem tl"></i><i class="fr-gem tr"></i><i class="fr-gem bl"></i><i class="fr-gem br"></i>   <!-- 外框的四角裝飾（裝備外框時才顯示） -->
      </div>

      <div id="controls" data-edit="controls" data-label="控制列">
        <div id="toolInfo" class="px-box tool-info">
          <div class="ti-name" id="tiName">—</div>
          <div class="bar"><div class="bar-fill" id="tiBar"></div></div>
          <div class="ti-dur" id="tiDur">0/0</div>
        </div>
        <button class="px-btn hidden" id="btnFeed">餵食</button>
        <button class="px-btn" id="btnAuto">手動</button>
        <button class="px-btn" id="btnLeave" title="離開礦坑">離開</button>
      </div>
      <div id="rollLog" class="roll-log hidden"></div>
    </section>

    <!-- ===== 背包 ===== -->
    <section class="screen" id="scr-bag">
      <div class="px-box panel" data-edit="bagTools" data-label="背包-工具">
        <div class="panel-title">工具 <span class="sub" id="bagPlays"></span><button class="px-btn small" data-jump="buy">買鎬子 ▶</button></div>
        <div id="bagTools" class="list"></div>
      </div>
      <div class="px-box panel" data-edit="bagOres" data-label="背包-礦石">
        <div class="panel-title">礦石 <button class="px-btn small" data-jump="sell">賣礦石 ▶</button></div>
        <div class="sub" id="bagOreTotal"></div>
        <div id="bagOres" class="list"></div>
      </div>
    </section>

    <!-- ===== 地圖 ===== -->
    <section class="screen" id="scr-map">
      <div class="px-box panel" data-edit="mapPanel" data-label="地圖">
        <div class="panel-title">地圖 <span class="sub">每座礦坑的礦氣每天都會變，用觀測鏡看徵兆</span></div>
        <div id="mapList" class="list"></div>
      </div>
    </section>

    <!-- ===== 帳號（2026-10-03）：點頂部名字進來；名字＋雲端存檔／玩家 ID ===== -->
    <section class="screen" id="scr-acct">
      <div class="px-box panel" data-edit="acctPanel" data-label="帳號">
        <div class="panel-title">帳號</div>
        <div class="acct2"><div class="cell"><span id="acctName" class="acct-player-name"></span></div>
          <button class="px-btn small" id="acctRename">改名字</button>
          <div class="cell" id="acctTitle"></div><button class="px-btn small" id="acctTitlePick">換頭銜</button></div>
      </div>
      <div class="px-box panel hidden" id="fxPanel"></div>   <!-- 顯示（減少特效）：冒險之地才有的演出，一般玩家看不到那座礦坑時不顯示 -->
      <div class="px-box panel" id="cloudPanel" data-edit="cloudPanel" data-label="雲端存檔"></div>
      <button class="px-btn wide boss-opt" id="acctBack">◀ 返回</button>
    </section>

    <!-- ===== 紀錄（v0.10.13）：圖鑑／成就 兩個子分頁 ===== -->
    <section class="screen" id="scr-rec">
      <div class="subtabs" role="tablist">
        <button class="subtab" data-rec="dex" role="tab">圖鑑</button>
        <button class="subtab" data-rec="ach" role="tab">成就</button>
      </div>
      <div id="recDex" class="rec-pane">
        <div class="px-box panel" data-edit="dexPanel" data-label="圖鑑">
          <div class="panel-title">圖鑑 <span class="sub" id="dexCount"></span></div>
          <div id="dexTabs" class="scope-mines dex-tabs"></div>
          <div id="dexList"></div>
        </div>
      </div>
      <div id="recAch" class="rec-pane hidden">
        <div id="achTabs" class="scope-mines dex-tabs"></div>   <!-- 2026-10-03：成就分書籤，之後其他台的成就再加 -->
        <div class="px-box panel ach-senpai" data-edit="achSenpai" data-label="成就-前輩信賴">
          <div class="panel-title">前輩信賴 <span class="sub" id="bagSenpaiSince"></span></div>
          <div id="bagSenpai" class="list"></div>
        </div>
        <div class="px-box panel ach-senpai" data-edit="achMemory" data-label="成就-珍貴回憶">
          <div class="panel-title">珍貴回憶 <span class="sub" id="bagMemCount"></span></div>
          <div id="bagMemory" class="list"></div>
        </div>
        <div class="px-box panel hidden" id="achLook" data-edit="achLook" data-label="成就-外觀">   <!-- 2026-10-05：外觀（名字顏色、敘述框外框） -->
          <div class="panel-title">外觀 <span class="sub">名字顏色・敘述框外框</span></div>
          <div id="achLookList" class="list"></div>
        </div>
        <div class="px-box panel hidden" id="achTitles" data-edit="achTitles" data-label="成就-稱號">
          <div class="panel-title">頭銜 <span class="sub" id="titleCount"></span></div>
          <div class="title-preview" id="titlePreview"><div class="sub">目前的樣子</div><span id="titlePreviewName" class="title-preview-name"></span><div id="titlePreviewBadge"></div></div>
          <div class="title-chips" id="titleChips"></div>
          <div class="title-list" id="titleList"></div>
          <div class="sub title-foot" id="titleFoot"></div>
          <button class="px-btn wide" id="titleClear">不戴頭銜</button>
          <button class="px-btn wide" id="titleBackAcct">◀ 回到帳號</button>
        </div>
      </div>
    </section>

    <!-- ===== 礦坑老闆 佐佐木（委託板 / 收購 / 鎬子 / 恩惠 / 補給） ===== -->
    <section class="screen" id="scr-shop">
      <div class="px-box panel boss-head" data-edit="bossHead" data-label="老闆-恩惠等級">
        <div class="mb-row"><span id="bossLv">恩惠 Lv1</span></div>
        <div class="bar"><div class="bar-fill" id="bossFavorBar"></div></div>
      </div>
      <div class="boss-dialog" data-edit="bossDialog" data-label="老闆-對話框">
        <div class="boss-name" id="bossName">佐佐木</div>
        <div class="px-box textbox boss-say" id="bossSay">……</div>
      </div>
      <div id="bossBody" data-edit="bossBody" data-label="老闆-選項"></div>
    </section>

    <!-- ===== 礦脈觀測鏡（專屬畫面） ===== -->
    <section class="screen" id="scr-scope">
      <div class="px-box panel" data-edit="scopeHead" data-label="觀測-礦坑選擇">
        <div class="panel-title">礦脈觀測鏡 <span class="sub" id="scopeSub"></span></div>
        <div id="scopeMines" class="scope-mines"></div>
      </div>
      <div class="px-box scope-lens" id="scopeLens" data-edit="scopeLens" data-label="觀測-鏡片">
        <div id="scopeRing" class="scope-ring"><div id="scopeIcon" class="scope-icon">◎</div></div>
        <div id="scopeName" class="scope-name"></div>
        <div id="scopeSay" class="scope-say">……</div>
      </div>
      <div id="scopeCtrl" class="scope-ctrl"></div>
      <div class="px-box panel" data-edit="scopeLog" data-label="觀測-今日紀錄">
        <div class="panel-title">今日觀測紀錄 <span class="sub" id="scopeCount"></span></div>
        <div id="scopeList" class="list"></div>
      </div>
    </section>
  </main>

  <!-- ===== 底部導覽 ===== -->
  <!-- v0.10.13：五項主導覽＋一致的像素圖示（10×10 格，currentColor 上色） -->
  <nav id="nav" data-edit="nav" data-label="底部導覽">
    <button data-go="mine" class="active"><svg class="nav-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-mine"/></svg><span>挖礦</span></button>
    <button data-go="bag"><svg class="nav-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-bag"/></svg><span>背包</span></button>
    <button data-go="map"><svg class="nav-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-map"/></svg><span>地圖</span></button>
    <button data-go="shop"><svg class="nav-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-boss"/></svg><span>老闆</span></button>
    <button data-go="rec"><svg class="nav-ico" viewBox="0 0 10 10" aria-hidden="true"><use href="#ico-rec"/></svg><span>紀錄</span></button>
  </nav>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ico-mine" viewBox="0 0 10 10"><path d="M2 1h6v1H2zM1 2h2v1H1zM7 2h2v1H7zM0 3h2v2H0zM8 3h2v2H8zM4 2h2v8H4z"/></symbol>
    <symbol id="ico-bag" viewBox="0 0 10 10"><path fill-rule="evenodd" d="M3 0h4v1H3zM2 1h1v2H2zM7 1h1v2H7zM1 3h8v7H1zM4 5h2v2H4z"/></symbol>
    <symbol id="ico-map" viewBox="0 0 10 10"><path d="M0 1h3v8H0zM4 2h2v8H4zM7 1h3v8H7z"/></symbol>
    <symbol id="ico-boss" viewBox="0 0 10 10"><path d="M2 0h6v1H2zM3 1h4v3H3zM1 5h8v5H1z"/></symbol>
    <!-- 紅晶：像素紅寶石，左上切面打亮 -->
    <symbol id="ico-ruby" viewBox="0 0 10 10">
      <path fill="#4f0d16" d="M2 1h6v1H2zM1 2h8v1H1zM0 3h10v1H0zM0 4h10v1H0zM1 5h8v1H1zM2 6h6v1H2zM3 7h4v1H3zM4 8h2v1H4z"/>
      <path fill="#8f1a28" d="M2 1h6v1H2zM1 2h8v1H1zM0 3h10v1H0zM1 4h6v1H1zM2 5h4v1H2zM3 6h2v1H3z"/>
      <path fill="#c23a48" d="M3 1h3v1H3zM2 2h3v1H2zM1 3h2v1H1z"/>
      <path fill="#e8a7ae" d="M3 1h1v1H3zM2 2h1v1H2z"/>
    </symbol>
    <symbol id="ico-rec" viewBox="0 0 10 10"><path fill-rule="evenodd" d="M1 0h8v10H1zM3 2h4v1H3zM3 4h4v1H3zM3 6h3v1H3z"/></symbol>
  </svg>

  <button id="editFab" class="hidden" title="編輯模式">✎</button>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="px-box modal-box" id="modalBox"></div></div>

  <!-- 開場動畫（2026-10-03）：一路往下挖，日期確認好就收起 -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="sp-title">深層礦脈</div>
    <div class="sp-shaft">
      <div class="sp-rock"></div>
      <svg class="sp-pick" viewBox="0 0 10 10"><use href="#ico-mine"/></svg>
    </div>
    <div class="sp-depth">深度 <b id="spDepth">0</b> m</div>
    <div class="sp-tip">往下挖<span class="sp-dots"></span></div>
    <div class="sp-copy">© 2026 Charles0148 版權所有</div>
  </div>
</div>

<div id="editor" class="hidden"></div>

<script src="js/version.js?v=1.04.01"></script>
<script src="js/cloud-config.js?v=1.04.01"></script>
<script src="js/cloud.js?v=1.04.01"></script>
<script src="js/config.js?v=1.04.01"></script>
<script src="js/engine.js?v=1.04.01"></script>
<script src="js/engine2.js?v=1.04.01"></script>
<script src="js/mine-hunt.js?v=1.04.01"></script>
<script src="js/hunt-mon.js?v=1.04.01"></script>
<script src="js/hunt-fx.js?v=1.04.01"></script>
<script src="js/hunt-scene.js?v=1.04.01"></script>
<script src="js/hunt-item-art.js?v=1.04.01"></script>
<script src="js/hunt-ui.js?v=1.04.01"></script>
<script src="js/boons.js?v=1.04.01"></script>
<script src="js/ruby.js?v=1.04.01"></script>
<script src="js/titles.js?v=1.04.01"></script>
<script src="js/game.js?v=1.04.01"></script>
</body>
</html>
